          ? buildDl(b)
          : `<p class="hidden-build">${b && b.locked ? 'Locked and hidden until the reveal.' : 'Nothing locked in yet.'}</p>`}
      </article>`; }).join('')}</div></section>`;
}

function screenTournament(){
  const total = managers().length, n = lockedList().length;
  if (!S.tourney) {
    if (n < total) return `<section><p class="eyebrow">${esc(S.league.name)}</p>
      <div class="head"><h2>Tournament</h2></div><div class="courtline"></div>
      <div class="empty-state" style="margin-top:18px"><h3>Waiting on ${total - n} build${total - n > 1 ? 's' : ''}</h3>
        <p class="note">Three groups of four, round robin, then a placement bracket — 38 best-of-three
          series in all. Every one of the twelve draft slots gets decided by a game somebody played.</p>
        <p class="note" style="margin-top:10px">${esc(managers().filter((m, i) => !(S.builds[String(i)] || {}).locked).join(', '))} still to lock in.</p>
      </div></section>`;
    return `<section><p class="eyebrow">${esc(S.league.name)}</p>
      <div class="head"><h2>Tournament</h2></div><div class="courtline"></div>
      <div class="empty-state" style="margin-top:18px"><h3>All twelve are in</h3>
        <p class="note" style="margin-bottom:16px">38 best-of-three series. First to 11, win by two,
          make-it-take-it. Every possession is simulated and every result replays from its seed.</p>
        <button class="btn hot" data-act="run" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Running…' : 'Run the tournament'}</button>
      </div></section>`;
  }
  const t = S.tourney;
  const name = id => (t.placements.find(p => p.id === id) || {}).manager || id;
  const sBtn = s => `<button class="sbtn" data-series="${esc(s.key)}">
      <span class="w">${esc(name(s.winnerId))}</span>
      <span class="sc">${s.wins[s.winnerId === s.ids[0] ? 0 : 1]}-${s.wins[s.winnerId === s.ids[0] ? 1 : 0]}</span>
      <span class="l">${esc(name(s.loserId))}</span><span></span>
      <span class="gs">${s.scores.map(sc => sc.join('-')).join(' · ')}</span></button>`;

  return `<section><p class="eyebrow">${esc(S.league.name)} · seed “${esc(t.seed)}”</p>
    <div class="head"><h2>Tournament</h2>
      <button class="btn ghost sm" data-act="rerun">Re-run with a new seed</button></div>
    <div class="courtline" style="margin-bottom:16px"></div>
    <h3 style="font-size:18px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Group Stage</h3>
    <div class="groups" style="margin-bottom:26px">${t.groups.map(g => `<div class="gcard">
      <h4>Group ${g.name}</h4><table><thead><tr><th>Team</th><th class="r">W-L</th><th class="r">Diff</th></tr></thead>
      <tbody>${g.table.map(r => `<tr><td class="p-name" style="font-size:15px">${esc(name(r.id))}</td>
        <td class="r num">${r.w}-${r.l}</td>
        <td class="r num">${r.diff > 0 ? '+' : ''}${r.diff}</td></tr>`).join('')}</tbody></table></div>`).join('')}</div>
    <h3 style="font-size:18px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Bracket</h3>
    <div class="rounds">${t.rounds.map(r => `<div class="round"><h4>${esc(r.name)}</h4>
      <div class="series">${r.series.map(sBtn).join('')}</div></div>`).join('')}</div>
    <p class="note" style="margin-top:16px">Click any series for the full possession-by-possession log.</p>
  </section>`;
}

function screenBoard(){
  const t = S.tourney;
  return `<section><p class="eyebrow">${esc(S.league.name)} · decided on the floor</p>
    <div class="head"><h2>Draft Order</h2>
      <button class="btn ghost sm" data-act="copy">Copy order</button></div>
    <div class="courtline" style="margin-bottom:16px"></div>
    <div class="board-list">${t.placements.map(p => `<div class="pickrow ${p.place <= 3 ? 'top' : ''}">
      <span class="pick-n">${p.place}</span>
      <span><span class="pick-m">${esc(p.manager)}</span>
        <span class="pick-d">${esc(p.decidedBy)} · seeded ${p.seed} out of group ${p.group}</span></span>
      <span class="pick-r">${p.record} in series<br>${p.seriesPlayed} played</span></div>`).join('')}</div>
    <p class="note" style="margin-top:14px">Reproducible from seed “${esc(t.seed)}” — anyone can replay
      every possession of all 38 series and get exactly these results.</p></section>`;
}

/* ── play-by-play ───────────────────────────────────────────────────────── */
function openSeries(key){
  const t = S.tourney;
  const all = t.groups.flatMap(g => g.series).concat(t.rounds.flatMap(r => r.series));
  const s = all.find(x => x.key === key);
  if (!s) return;
  const fighters = fightersFromBuilds();
  const byId = new Map(fighters.map(f => [f.id, f]));
  const a = byId.get(s.ids[0]), b = byId.get(s.ids[1]);
  if (!a || !b) return;
  const series = simulateSeries(a, b, s.seed);
  $('dlg-t').textContent = s.managers[0] + ' vs ' + s.managers[1];
  $('dlg-b').innerHTML = `<p class="note" style="margin:10px 0 0">${esc(s.round)} · best of three ·
    ${esc(s.managers[series.winner])} wins ${series.wins[series.winner]}-${series.wins[1 - series.winner]}</p>` +
    series.games.map((g, i) => `<div class="gm"><h4><span>Game ${i + 1}</span>
      <span>${esc(g.managers[0])} ${g.score[0]} — ${g.score[1]} ${esc(g.managers[1])}</span></h4>
      <p class="note" style="margin:0 0 6px">${esc(g.opening)}</p>
      <ul class="pbp">${g.log.map(l => `<li class="${l.pts ? 'score' : l.action === 'turnover' || l.action === 'block' ? 'turn' : ''}">
        <span class="n">${l.n}</span>
        <span><b>${esc(l.offName)}</b> — ${esc(l.text)}</span>
        <span class="s">${l.score[0]}-${l.score[1]}</span></li>`).join('')}</ul></div>`).join('');
  $('dlg').showModal();
}

/* ── actions ────────────────────────────────────────────────────────────── */
async function claim(i){
  const path = 'builds/' + i;
  const existing = S.builds[String(i)];
  if (existing && existing.token && existing.token !== TOKEN) return;
  if (live) {
    const lease = await db.doc(path).acquire({ holder: TOKEN, ttlMs: 8000 });
    if (!lease.acquired) { alert('Someone else is claiming that slot right now. Try again in a moment.'); return; }
    const snap = await db.doc(path).get();
    const cur = snap.exists ? snap.data() : null;
    if (cur && cur.token && cur.token !== TOKEN) { alert('That slot was just claimed.'); return; }
  }
  S.me = i; LS.set('me', i);
  await saveBuild({ slot: String(i), manager: managers()[i], token: TOKEN,
                    picks: (existing && existing.picks) || {}, locked: false });
}

async function pick(playerId){
  if (S.tab === 'lab') {
    if (SLOT_KEYS.some(k => k !== S.slot && S.lab.picks[k] === playerId)) return;
    S.lab.picks = { ...S.lab.picks, [S.slot]: playerId };
    S.lab.result = null;
    LS.set('lab', S.lab.picks);
    const nx = SLOT_KEYS.slice(SLOT_KEYS.indexOf(S.slot) + 1)
                        .concat(SLOT_KEYS.slice(0, SLOT_KEYS.indexOf(S.slot)))
                        .find(k => !S.lab.picks[k]);
    if (nx) { S.slot = nx; S.q = ''; }
    render();
    return;
  }
  const b = myBuild();
  if (!b || b.locked) return;
  if (SLOT_KEYS.some(k => k !== S.slot && b.picks[k] === playerId)) return;
  await saveBuild({ ...b, picks: { ...b.picks, [S.slot]: playerId } });
  const i = SLOT_KEYS.indexOf(S.slot);
  const next = SLOT_KEYS.slice(i + 1).concat(SLOT_KEYS.slice(0, i))
                        .find(k => !({ ...b.picks, [S.slot]: playerId })[k]);
  if (next) { S.slot = next; S.q = ''; render(); }
}

async function runTourney(seed){
  S.busy = true; render();
  try {
    const t = runTournament(fightersFromBuilds(), seed);
    await saveTourney(stripLogs(t));
    S.tab = 'board';
  } catch (e) {
    alert(e.message);
  } finally { S.busy = false; render(); }
}

function demoLeague(){
  const shapes = [
    { sc:99,hnd:97,frm:62,def:62,ath:74 }, { sc:74,hnd:54,frm:99,def:92,ath:76 },
    { sc:80,hnd:96,frm:58,def:66,ath:96 }, { sc:74,hnd:72,frm:84,def:96,ath:88 },
    { sc:90,hnd:64,frm:95,def:72,ath:78 }, { sc:85,hnd:85,frm:85,def:85,ath:85 },
    { sc:92,hnd:88,frm:70,def:70,ath:80 }, { sc:70,hnd:60,frm:92,def:88,ath:86 },
    { sc:88,hnd:80,frm:80,def:76,ath:76 }, { sc:66,hnd:90,frm:72,def:90,ath:84 },
    { sc:94,hnd:74,frm:88,def:60,ath:68 }, { sc:78,hnd:78,frm:78,def:92,ath:92 },
  ];
  const builds = {};
  shapes.forEach((sh, i) => {
    const picks = {};
    let spent = 0;
    const used = new Set();
    for (const k of SLOT_KEYS) {
      const left = BUDGET - spent - SLOT_KEYS.slice(SLOT_KEYS.indexOf(k) + 1).length * 40;
      const cands = POOL.filter(p => !used.has(p.id) && costOf(p[k]) <= Math.max(40, left))
                        .sort((a, z) => Math.abs(a[k] - sh[k]) - Math.abs(z[k] - sh[k]));
      const p = cands[0] || POOL.find(x => !used.has(x.id));
      picks[k] = p.id; used.add(p.id); spent += costOf(p[k]);
    }
    builds[String(i)] = { slot: String(i), manager: EXAMPLE_NAMES[i], token: 'demo',
                          picks, locked: true };
  });
  return { league: { name: 'Demo Run', budget: BUDGET, managers: EXAMPLE_NAMES.slice() }, builds };
}

function randomBuild(){
  // A legal, distinct-source build with the cap actually spent — a real starting
  // point to react to, not five random names that happen to fit.
  for (let attempt = 0; attempt < 400; attempt++) {
    const picks = {}; const used = new Set(); let spent = 0;
    const order = SLOT_KEYS.slice().sort(() => Math.random() - 0.5);
    for (let i = 0; i < order.length; i++) {
      const k = order[i];
      const left = budget() - spent - (order.length - i - 1) * 45;
      const cands = POOL.filter(p => !used.has(p.id) && costOf(p[k]) <= left);
      if (!cands.length) break;
      const p = cands[Math.floor(Math.random() * cands.length)];
      picks[k] = p.id; used.add(p.id); spent += costOf(p[k]);
    }
    if (priced(picks).ok && spent >= budget() - 40) return picks;
  }
  return { sc: 'klay16', hnd: 'reggie95', frm: 'tyson12', def: 'bowen05', ath: 'marion06' };
}

function runScout(idx){
  if (!priced(S.lab.picks).ok) return;
  S.lab.busy = true; render();
  // Yield a frame so the button repaints before the run blocks the thread.
  setTimeout(() => {
    try {
      const me = toFighter({ id: 'lab', manager: 'Your build', picks: S.lab.picks }, POOL);
      const field = labFighters();
      const seed = 'lab-' + Date.now();
      const g = gauntlet(me, field, 400, seed);
      const h2hIndex = typeof idx === 'number' ? idx
        : field.findIndex(f => f.manager === g.worst.name);
      const h = headToHead(me, field[h2hIndex], 400, seed + '|h2h');
      const lev = leverage({ id: 'lab', manager: 'Your build', picks: S.lab.picks },
                           POOL, field, toFighter, 120, seed + '|lev');
      S.lab.result = { gauntlet: g, h2h: h, leverage: lev, runs: 400,
                       readout: readout(g, h), h2hIndex,
                       h2hName: field[h2hIndex].manager, seed };
    } catch (e) {
      alert('Could not scout that build: ' + e.message);
    } finally { S.lab.busy = false; render(); }
  }, 16);
}

function watchLab(i){
  if (!priced(S.lab.picks).ok) return;
  const me = toFighter({ id: 'lab', manager: 'Your build', picks: S.lab.picks }, POOL);
  const opp = labFighters()[i];
  const seed = (S.lab.result ? S.lab.result.seed : 'lab') + '|watch|' + i + '|' + Date.now();
  const series = simulateSeries(me, opp, seed);
  $('dlg-t').textContent = 'Your build vs ' + opp.manager;
  $('dlg-b').innerHTML = `<p class="note" style="margin:10px 0 0">Best of three ·
    ${esc(series.managers[series.winner])} wins ${series.wins[series.winner]}-${series.wins[1 - series.winner]}</p>` +
    series.games.map((g, n) => `<div class="gm"><h4><span>Game ${n + 1}</span>
      <span>${esc(g.managers[0])} ${g.score[0]} — ${g.score[1]} ${esc(g.managers[1])}</span></h4>
      <p class="note" style="margin:0 0 6px">${esc(g.opening)}</p>
      <ul class="pbp">${g.log.map(l => `<li class="${l.pts ? 'score' : l.action === 'turnover' || l.action === 'block' ? 'turn' : ''}">
        <span class="n">${l.n}</span>
        <span><b>${esc(l.offName)}</b> — ${esc(l.text)}</span>
        <span class="s">${l.score[0]}-${l.score[1]}</span></li>`).join('')}</ul></div>`).join('');
  $('dlg').showModal();
}

/* ── render ─────────────────────────────────────────────────────────────── */
function render(){
  paintBoard(); paintTabs();
  let html;
  // Only the build screen needs to know who you are. Everything else is
  // spectator-safe, so someone watching on the big screen never hits a wall.
  if (S.tab === 'lab') html = screenLab();
  else if (S.tab === 'setup') html = screenSetup();
  else if (!S.league) { S.tab = 'lab'; html = screenLab(); }
  else if (S.tab === 'league') html = screenLeague();
  else if (S.tab === 'tournament') html = screenTournament();
  else if (S.tab === 'board') html = S.tourney ? screenBoard() : screenTournament();
  else html = (S.me != null && myBuild()) ? screenBuild() : screenIdentify();
  if (S.note === 'offline' && S.tab !== 'lab' && S.tab !== 'setup') html = `<div class="banner"><b>Not synced</b> — league sharing is
    unavailable in this view, so everything below is saved to this browser only. The build tools,
    the simulator and the tournament all work; other managers just won't see your entries.</div>` + html;
  $('app').innerHTML = html;
  paintTabs();
}

/* ── events ─────────────────────────────────────────────────────────────── */
document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-tab],[data-slot],[data-pick],[data-act],[data-claim],[data-series],[data-watch]');
  if (!t) return;
  if (t.dataset.tab)   { S.tab = t.dataset.tab; render(); }
  else if (t.dataset.slot)   { S.slot = t.dataset.slot; S.q = ''; render(); }
  else if (t.dataset.pick)   { await pick(t.dataset.pick); }
  else if (t.dataset.claim)  { await claim(Number(t.dataset.claim)); }
  else if (t.dataset.series) { openSeries(t.dataset.series); }
  else if (t.dataset.watch)  { watchLab(Number(t.dataset.watch)); }
  else if (t.dataset.act) {
    const a = t.dataset.act;
    if (a === 'save-league') {
      const names = [...document.querySelectorAll('[data-mgr]')].map(el => el.value.trim() || 'Manager');
      const cap = Math.max(200, Math.min(3000, parseInt($('in-cap').value, 10) || BUDGET));
      await saveLeague({ name: $('in-league').value.trim() || 'Sunday Run', budget: cap, managers: names });
      S.tab = 'build'; render();
    } else if (a === 'lock') {
      const b = myBuild();
      if (priced(b.picks).ok) await saveBuild({ ...b, locked: true, lockedAt: new Date().toISOString() });
    } else if (a === 'unlock') {
      await saveBuild({ ...myBuild(), locked: false });
    } else if (a === 'run') {
      await runTourney(S.league.name.toLowerCase().replace(/\s+/g, '-') + '-' + new Date().getFullYear());
    } else if (a === 'rerun') {
      const seed = prompt('Seed for the re-run — anything you like. The same seed always produces the same tournament.',
        'rerun-' + Math.random().toString(36).slice(2, 7));
      if (seed) await runTourney(seed);
    } else if (a === 'reset') {
      if (!confirm('Clear the league, every build and the draft order?')) return;
      if (live) {
        await db.doc('league/config').delete().catch(() => {});
        await db.doc('tournament/latest').delete().catch(() => {});
        for (const k of Object.keys(S.builds)) await db.doc('builds/' + k).delete().catch(() => {});
      }
      LS.set('league', null); LS.set('builds', {}); LS.set('tourney', null); LS.set('me', null);
      S.league = null; S.builds = {}; S.tourney = null; S.me = null; render();
    } else if (a === 'demo') {
      const d = demoLeague();
      S.league = d.league; S.builds = d.builds; S.me = null;
      if (!live) { LS.set('league', d.league); LS.set('builds', d.builds); }
      await runTourney('demo-run');
    } else if (a === 'scout' || a === 'rescout') {
      runScout();
    } else if (a === 'lab-clear') {
      S.lab = { picks: {}, result: null, busy: false }; LS.set('lab', {}); render();
    } else if (a === 'lab-random') {
      S.lab.picks = randomBuild(); S.lab.result = null; LS.set('lab', S.lab.picks); render();
    } else if (a === 'to-lab') {
      const b = myBuild();
      if (b) { S.lab.picks = { ...b.picks }; S.lab.result = null; LS.set('lab', S.lab.picks); }
      S.tab = 'lab'; render();
    } else if (a === 'to-league') {
      const b = myBuild();
      if (b && !b.locked && priced(S.lab.picks).ok) {
        await saveBuild({ ...b, picks: { ...S.lab.picks } });
        S.tab = 'build'; render();
      }
    } else if (a === 'copy-code') {
      const b = myBuild();
      navigator.clipboard?.writeText(encodeBuild(S.me, b.picks)).then(() => {
        t.textContent = 'Copied'; setTimeout(() => { t.textContent = 'Copy build code'; }, 1400);
      }).catch(() => {});
    } else if (a === 'import') {
      const lines = $('in-codes').value.split('\n').map(x => x.trim()).filter(Boolean);
      const ok = [], bad = [];
      for (const line of lines) {
        const r = decodeBuild(line);
        if (r.error) { bad.push(line.slice(0, 24) + ' — ' + r.error); continue; }
        await saveBuild({ slot: String(r.index), manager: managers()[r.index],
                          token: 'imported', picks: r.picks, locked: true });
        ok.push(managers()[r.index]);
      }
      const out = $('import-out');
      if (out) out.innerHTML = (ok.length ? '<b>Added ' + ok.length + ':</b> ' + esc(ok.join(', ')) : '') +
        (bad.length ? '<br><span style="color:var(--accent)">Skipped ' + bad.length + ': ' +
          esc(bad.join(' · ')) + '</span>' : '');
    } else if (a === 'copy') {
      const txt = S.tourney.placements.map(p => p.place + '. ' + p.manager).join('\n');
      navigator.clipboard?.writeText(txt).then(() => { t.textContent = 'Copied'; 
        setTimeout(() => { t.textContent = 'Copy order'; }, 1400); }).catch(() => {});
    }
  }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'in-q') { S.q = ev.target.value;
    const sc = document.querySelector('.scroll'); const top = sc ? sc.scrollTop : 0;
    render(); const s2 = document.querySelector('.scroll'); if (s2) s2.scrollTop = 0;
    const el = $('in-q'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'in-era')  { S.era = ev.target.value; render(); }
  if (ev.target.id === 'in-sort') { S.sortBy = ev.target.value; render(); }
});

/* ── boot ───────────────────────────────────────────────────────────────── */
const seeded = local.read();
S.league = seeded.league || null;
S.builds = seeded.builds || {};
S.tourney = seeded.tourney || null;
S.me = LS.get('me', null);
S.lab.picks = LS.get('lab', {}) || {};
if (!S.league) S.tab = 'lab';
render();
connect();
})();
</script>
