<title>Blacktop Draft</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#E8EAE6; --surface:#F6F7F4; --surface-2:#DFE3DC; --sunken:#D6DBD2;
  --ink:#14181A; --ink-2:#39423E; --muted:#69736D; --faint:#98A29B;
  --line:#C7CDC3; --line-soft:#D9DED4;
  --accent:#C4441F; --accent-ink:#FFF3EE; --accent-soft:#F5DED4;
  --court:#1F5E4E; --court-soft:#D3E5DD;
  --gold:#96682A; --gold-soft:#F0E2C8;
  --viz-win:#0E7A5C; --viz-loss:#C4441F; --viz-grid:#C7CDC3;
  --shadow:0 1px 0 rgba(20,24,26,.06), 0 8px 24px -16px rgba(20,24,26,.5);
  --f-display:"Saira Condensed",Oswald,"Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#101413; --surface:#171C1A; --surface-2:#1E2422; --sunken:#0B0E0D;
  --ink:#E9EEE9; --ink-2:#C2CBC5; --muted:#8B968F; --faint:#69736D;
  --line:#2B3330; --line-soft:#232A28;
  --accent:#FF6B3D; --accent-ink:#1A0E08; --accent-soft:#3A1D11;
  --court:#4FBF9A; --court-soft:#12312A;
  --gold:#D9A441; --gold-soft:#33270F;
  --viz-win:#20A47C; --viz-loss:#EA6134; --viz-grid:#2B3330;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 12px 28px -18px #000;
}}
:root[data-theme="dark"]{
  --ground:#101413; --surface:#171C1A; --surface-2:#1E2422; --sunken:#0B0E0D;
  --ink:#E9EEE9; --ink-2:#C2CBC5; --muted:#8B968F; --faint:#69736D;
  --line:#2B3330; --line-soft:#232A28;
  --accent:#FF6B3D; --accent-ink:#1A0E08; --accent-soft:#3A1D11;
  --court:#4FBF9A; --court-soft:#12312A;
  --gold:#D9A441; --gold-soft:#33270F;
  --viz-win:#20A47C; --viz-loss:#EA6134; --viz-grid:#2B3330;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 12px 28px -18px #000;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;margin:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.05;
  letter-spacing:.005em;font-weight:700}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── court-line rule: the double stripe painted on a blacktop key ── */
.courtline{height:0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);
  padding-bottom:3px;opacity:.28}

/* ── scoreboard strip ── */
.board{position:sticky;top:0;z-index:30;background:var(--sunken);
  border-bottom:1px solid var(--line);}
.board-in{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;
  align-items:center;gap:18px;flex-wrap:wrap}
.mark{display:flex;align-items:baseline;gap:9px;margin-right:auto}
.mark b{font-family:var(--f-display);font-size:22px;font-weight:800;letter-spacing:-.01em;
  text-transform:uppercase}
.mark span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
.stat{display:flex;flex-direction:column;gap:1px;min-width:62px}
.stat i{font-style:normal;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--f-display);font-size:19px;font-weight:700;
  font-variant-numeric:tabular-nums;line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:2px;
  border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.pill.live{border-color:var(--court);color:var(--court);background:var(--court-soft)}
.pill.hot{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

/* ── tabs ── */
nav.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:49px;z-index:29}
.tabs-in{max-width:1240px;margin:0 auto;padding:0 18px;display:flex;gap:2px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:11px 14px;
  font-family:var(--f-display);font-size:15px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .badge{font-family:var(--f-mono);font-size:10px;background:var(--accent);color:var(--accent-ink);
  padding:1px 5px;border-radius:2px;margin-left:6px;letter-spacing:0}

main{max-width:1240px;margin:0 auto;padding:22px 18px 80px}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);margin:0 0 6px}
.lede{color:var(--ink-2);max-width:64ch;margin:8px 0 0}
section{margin-bottom:34px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
  margin-bottom:12px}
.head h2{font-size:27px;text-transform:uppercase;letter-spacing:.01em}

/* ── build bay ── */
.bay{display:grid;grid-template-columns:minmax(300px,384px) 1fr;gap:22px;align-items:start}
@media (max-width:900px){.bay{grid-template-columns:1fr}}
.sheet{background:var(--surface);border:1px solid var(--line);position:sticky;top:100px;
  max-height:calc(100vh - 116px);overflow-y:auto}
@media (max-width:900px){.sheet{position:static;max-height:none;overflow:visible}}
.sheet-hd{padding:13px 15px 11px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.sheet-hd h3{font-size:17px;text-transform:uppercase;letter-spacing:.05em}
.cap{padding:13px 15px;border-bottom:1px solid var(--line-soft)}
.cap-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px}
.cap-row b{font-family:var(--f-display);font-size:31px;font-weight:800;font-variant-numeric:tabular-nums;
  line-height:.9}
.cap-row small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.meter{height:7px;background:var(--sunken);border:1px solid var(--line-soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--court);transition:width .3s ease}
.meter i.over{background:var(--accent)}
.slot{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 15px;width:100%;
  text-align:left;background:none;border:0;border-bottom:1px solid var(--line-soft);cursor:pointer;
  border-left:3px solid transparent}
.slot:hover{background:var(--surface-2)}
.slot[aria-current="true"]{border-left-color:var(--accent);background:var(--surface-2)}
.slot-k{font-family:var(--f-mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);grid-column:1}
.slot-v{font-family:var(--f-display);font-size:18px;font-weight:600;grid-column:1;line-height:1.15}
.slot-v.empty{color:var(--faint);font-style:italic;font-weight:500}
.slot-sub{font-size:12px;color:var(--muted);grid-column:1}
.slot-r{grid-column:2;grid-row:1/4;text-align:right;display:flex;flex-direction:column;
  justify-content:center;gap:2px}
.rating{font-family:var(--f-display);font-size:25px;font-weight:800;font-variant-numeric:tabular-nums;
  line-height:1}
.price{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.sheet-ft{padding:13px 15px;display:flex;flex-direction:column;gap:9px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--ground);padding:9px 15px;
  font-family:var(--f-display);font-size:15px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;cursor:pointer;transition:opacity .15s}
.btn:hover:not(:disabled){opacity:.85}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.hot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 11px;font-size:13px}
.warn{font-size:12.5px;color:var(--accent);display:flex;gap:7px;align-items:flex-start}
.warn::before{content:"▲";font-size:9px;line-height:1.6;flex:none}

/* ── pool table ── */
.pool{background:var(--surface);border:1px solid var(--line)}
.pool-hd{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:11px;
  align-items:center;flex-wrap:wrap;background:var(--surface-2)}
.pool-hd h3{font-size:17px;text-transform:uppercase;letter-spacing:.05em;margin-right:auto}
input[type=search],input[type=text],select{font:inherit;font-size:13.5px;padding:6px 9px;
  background:var(--ground);border:1px solid var(--line);color:var(--ink);border-radius:0}
input[type=search]{min-width:170px}
.scroll{max-height:min(66vh,720px);overflow-y:auto;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{position:sticky;top:0;background:var(--surface);z-index:2;text-align:left;
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);font-weight:500;padding:8px 11px;border-bottom:1px solid var(--line);
  white-space:nowrap}
tbody td{padding:8px 11px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
tbody tr.picked{background:var(--court-soft)}
tbody tr.unaffordable{opacity:.42}
.p-name{font-family:var(--f-display);font-size:16.5px;font-weight:600;line-height:1.15}
.p-meta{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.03em}
.p-note{font-size:12px;color:var(--muted);max-width:38ch}
td.r{text-align:right;white-space:nowrap}
.big{font-family:var(--f-display);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.era{font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 5px;border:1px solid var(--line);color:var(--muted)}

/* ── league roster ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:12px}
.mgr{background:var(--surface);border:1px solid var(--line);padding:12px 14px;
  display:flex;flex-direction:column;gap:7px;border-top:3px solid var(--line)}
.mgr.locked{border-top-color:var(--court)}
.mgr.you{border-top-color:var(--accent)}
.mgr-hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.mgr-hd b{font-family:var(--f-display);font-size:19px;font-weight:700}
.mgr dl{margin:0;display:grid;grid-template-columns:auto 1fr auto;gap:3px 9px;font-size:12.5px}
.mgr dt{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);align-self:center}
.mgr dd{margin:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mgr dd.v{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-align:right}
.hidden-build{font-size:12.5px;color:var(--faint);font-style:italic;padding:4px 0}

/* ── tournament ── */
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:14px}
.gcard{background:var(--surface);border:1px solid var(--line)}
.gcard h4{margin:0;padding:9px 13px;font-family:var(--f-display);font-size:15px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;border-bottom:1px solid var(--line);
  background:var(--surface-2)}
.rounds{display:flex;flex-direction:column;gap:14px}
.round h4{margin:0 0 7px;font-family:var(--f-display);font-size:15px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.series{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:9px}
.sbtn{display:grid;grid-template-columns:1fr auto;gap:3px 10px;background:var(--surface);
  border:1px solid var(--line);padding:9px 12px;text-align:left;cursor:pointer;width:100%}
.sbtn:hover{border-color:var(--accent)}
.sbtn .w{font-family:var(--f-display);font-size:16px;font-weight:700}
.sbtn .l{font-family:var(--f-display);font-size:16px;font-weight:500;color:var(--muted)}
.sbtn .sc{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
.sbtn .gs{grid-column:1/3;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);
  letter-spacing:.04em;padding-top:2px;border-top:1px solid var(--line-soft);margin-top:3px}

/* ── draft board ── */
.board-list{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);
  background:var(--surface)}
.pickrow{display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;
  padding:13px 16px;border-bottom:1px solid var(--line-soft)}
.pickrow:last-child{border-bottom:0}
.pickrow.top{background:var(--gold-soft)}
.pick-n{font-family:var(--f-display);font-size:38px;font-weight:800;line-height:.85;
  font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.pickrow.top .pick-n{color:var(--gold)}
.pick-m{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.1}
.pick-d{font-size:12.5px;color:var(--muted)}
.pick-r{text-align:right;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);
  line-height:1.7;white-space:nowrap}

/* ── play-by-play ── */
dialog{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0;
  max-width:660px;width:calc(100% - 32px);max-height:84vh;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(8,11,10,.62)}
.dlg-hd{padding:14px 18px;border-bottom:1px solid var(--line);background:var(--surface-2);
  display:flex;align-items:center;gap:12px;position:sticky;top:0}
.dlg-hd h3{font-size:20px;text-transform:uppercase;letter-spacing:.04em;margin-right:auto}
.dlg-bd{padding:6px 18px 18px;overflow-y:auto;max-height:calc(84vh - 60px)}
.gm{margin-top:14px}
.gm h4{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between}
.pbp{list-style:none;margin:0;padding:0;font-size:13.5px}
.pbp li{display:grid;grid-template-columns:40px 1fr 46px;gap:10px;padding:5px 0;
  border-bottom:1px solid var(--line-soft);align-items:baseline}
.pbp .n{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);text-align:right}
.pbp .s{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;text-align:right;
  color:var(--muted)}
.pbp li.score{background:var(--court-soft)}
.pbp li.score .s{color:var(--ink);font-weight:600}
.pbp li.turn{color:var(--muted)}

/* ── scouting report ── */
.report{background:var(--surface);border:1px solid var(--line);margin-top:18px}
.report-hd{padding:13px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.report-hd h3{font-size:19px;text-transform:uppercase;letter-spacing:.05em;margin-right:auto}
.hero{display:flex;align-items:baseline;gap:12px;padding:16px 16px 6px}
.hero b{font-family:var(--f-display);font-size:56px;font-weight:800;line-height:.82;
  font-variant-numeric:tabular-nums}
.hero .cap{padding:0;border:0;max-width:34ch}
.hero i{font-style:normal;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);display:block}
.reads{margin:0;padding:2px 16px 14px;list-style:none;display:flex;flex-direction:column;gap:5px;
  max-width:70ch}
.reads li{font-size:13.5px;color:var(--ink-2);padding-left:14px;position:relative}
.reads li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;
  background:var(--muted)}
.vsec{padding:14px 16px;border-top:1px solid var(--line-soft)}
.vsec h4{margin:0 0 3px;font-family:var(--f-display);font-size:15px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase}
.vsec p.note{margin:0 0 11px}
.bars{display:flex;flex-direction:column;gap:4px}
.bar{display:grid;grid-template-columns:126px 1fr 58px;gap:11px;align-items:center;font-size:13px}
.bar .lbl{text-align:right;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.track{position:relative;height:19px;background:var(--sunken);border:1px solid var(--line-soft)}
.track .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--viz-grid)}
.track .fill{position:absolute;top:2px;bottom:2px;min-width:3px}
.track .fill.win{background:var(--viz-win);border-radius:0 4px 4px 0}
.track .fill.loss{background:var(--viz-loss);border-radius:4px 0 0 4px}
.track .fill.mag{left:2px;background:var(--viz-win);border-radius:0 4px 4px 0}
.axis{display:grid;grid-template-columns:126px 1fr 58px;gap:11px;margin-top:5px}
.axis span{grid-column:2;display:flex;justify-content:space-between;font-family:var(--f-mono);
  font-size:9.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--f-mono);font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.mixrow{display:grid;grid-template-columns:96px 1fr 96px;gap:11px;align-items:center;font-size:13px;
  padding:3px 0}
.mixrow .val{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;
  color:var(--muted)}
details.tbl{margin-top:12px}
details.tbl summary{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);cursor:pointer}
details.tbl table{margin-top:8px;font-size:12.5px}
.oppgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:9px}
.opp{background:var(--surface);border:1px solid var(--line);padding:10px 12px;text-align:left;
  cursor:pointer;display:flex;flex-direction:column;gap:4px;border-left:3px solid var(--line)}
.opp:hover{border-left-color:var(--accent)}
.opp[aria-pressed="true"]{border-left-color:var(--accent);background:var(--surface-2)}
.opp b{font-family:var(--f-display);font-size:17px;font-weight:700}
.opp span{font-size:12px;color:var(--muted)}
.opp code{font-family:var(--f-mono);font-size:10.5px;color:var(--faint)}

/* ── setup + misc ── */
.card{background:var(--surface);border:1px solid var(--line);padding:18px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px;margin:14px 0}
.name-in{display:flex;align-items:center;gap:8px}
.name-in span{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:18px;text-align:right}
.name-in input{flex:1;min-width:0}
.note{font-size:12.5px;color:var(--muted);margin:0}
.empty-state{text-align:center;padding:42px 18px;border:1px dashed var(--line);background:var(--surface)}
.empty-state h3{font-size:23px;text-transform:uppercase;margin-bottom:7px}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.banner{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface);
  padding:11px 14px;font-size:13px;color:var(--ink-2);margin-bottom:18px}
.banner b{font-family:var(--f-display);letter-spacing:.04em;text-transform:uppercase}
</style>

<header class="board">
  <div class="board-in">
    <div class="mark"><b id="mk-name">Blacktop Draft</b><span id="mk-sub">1v1 for draft order</span></div>

// Pricing and build validation.
//
// The cost curve is convex on purpose: buying a 95 should hurt roughly twice as
// much as buying an 85, not 12% more. Below ~66 the curve would produce costs
// so small they collide, so the floor is the rating itself — which keeps cost
// strictly monotonic across the whole 1..99 range (a rating that is one point
// better always costs strictly more).

const BUDGET = 750;

const SLOTS = [
  { key: 'sc',  label: 'Shot Creation', short: 'SC',
    blurb: 'Getting a shot off against a set defender — and making it.' },
  { key: 'hnd', label: 'Handles', short: 'HND',
    blurb: 'Ball security under pressure, change of direction, beating a hand-check.' },
  { key: 'frm', label: 'Frame', short: 'FRM',
    blurb: 'Height, length and strength. Post leverage, contest radius, rebounding.' },
  { key: 'def', label: 'Defense', short: 'DEF',
    blurb: 'On-ball containment, active hands, contesting and blocking drives.' },
  { key: 'ath', label: 'Athleticism', short: 'ATH',
    blurb: 'First step, burst, vertical, lateral quickness, conditioning.' },
];

const SLOT_KEYS = SLOTS.map(s => s.key);

function costOf(rating) {
  const r = Math.round(rating);
  if (!Number.isFinite(r) || r < 1 || r > 99) {
    throw new RangeError(`rating out of range: ${rating}`);
  }
  return Math.max(r, Math.round(250 * Math.pow(r / 100, 3.2)));
}

// picks: { sc: playerId, hnd: playerId, ... }
function priceBuild(picks, pool) {
  const byId = pool instanceof Map ? pool : new Map(pool.map(p => [p.id, p]));
  let total = 0;
  const lines = [];
  for (const slot of SLOTS) {
    const id = picks?.[slot.key];
    if (!id) { lines.push({ slot: slot.key, empty: true, cost: 0 }); continue; }
    const player = byId.get(id);
    if (!player) throw new Error(`unknown player id "${id}" in slot ${slot.key}`);
    const rating = player[slot.key];
    const cost = costOf(rating);
    total += cost;
    lines.push({ slot: slot.key, playerId: id, player, rating, cost, empty: false });
  }
  return { total, lines, remaining: BUDGET - total };
}

function validateBuild(picks, pool, budget = BUDGET) {
  const errors = [];
  const priced = priceBuild(picks, pool);
  const empty = priced.lines.filter(l => l.empty).map(l => l.slot);
  if (empty.length) {
    const names = empty.map(k => SLOTS.find(s => s.key === k).label);
    errors.push(`${empty.length} slot${empty.length > 1 ? 's' : ''} still empty: ${names.join(', ')}`);
  }
  if (priced.total > budget) {
    errors.push(`over the cap by ${priced.total - budget} (spent ${priced.total} of ${budget})`);
  }
  // Five attributes, five different players — taking a player's frame AND his
  // athleticism is just picking that player, which is not the game.
  const seen = new Map();
  for (const l of priced.lines) {
    if (l.empty) continue;
    seen.set(l.playerId, (seen.get(l.playerId) || 0) + 1);
  }
  for (const [id, n] of seen) {
    if (n > 1) {
      const player = (pool instanceof Map ? pool : new Map(pool.map(p => [p.id, p]))).get(id);
      errors.push(`${player.name} fills ${n} slots — each attribute must come from a different player`);
    }
  }
  return { ok: errors.length === 0, errors, ...priced };
}

// Turn stored picks into the shape the sim wants: ratings plus the source
// player behind each one, so the play-by-play can name names.
function toFighter(build, pool) {
  const byId = pool instanceof Map ? pool : new Map(pool.map(p => [p.id, p]));
  const slots = {};
  const ratings = {};
  for (const slot of SLOTS) {
    const player = byId.get(build.picks[slot.key]);
    if (!player) throw new Error(`build "${build.id}" has no player in slot ${slot.key}`);
    ratings[slot.key] = player[slot.key];
    slots[slot.key] = { id: player.id, name: player.name, last: lastName(player.name), rating: player[slot.key] };
  }
  return { id: build.id, manager: build.manager, ratings, slots };
}

function lastName(full) {
  const parts = String(full).split(' ');
  return parts.length > 1 ? parts.slice(1).join(' ') : full;
}


// The possession engine.
//
// Half-court 1v1: first to 11, win by 2, hard cap 21, make-it-take-it, 1s and
// 2s. Every game is a pure function of its seed string, so any result in the
// tournament can be replayed and audited rather than taken on faith.

const TARGET = 11;
const HARD_CAP = 21;

function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hashSeed(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < String(str).length; i++) {
    h ^= String(str).charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

const norm = r => (r - 70) / 15;
const logistic = x => 1 / (1 + Math.exp(-x));

// Tuned constants. See test/balance.test.js — these are not arbitrary; each one
// is pinned by a criterion in factory/SPEC.md.
const K = {
  toBase: -1.95, toK: 0.37,
  choiceTemp: 1.15, driveBias: 0.26, jumpBias: 0.30, postBias: -0.48,
  driveBase: 0.20, driveK: 0.245,
  jumpBase: -0.60, jumpK: 0.263,
  postBase: 0.12, postK: 0.217,
  blockBase: -2.60, blockK: 0.42, blockEvade: 0.34,
  orebBase: -1.28, orebK: 0.24,
  sepBase: -1.40, sepK: 0.72, sepBonus: 0.62,
  cleanBase: -1.35, cleanK: 0.85,
  fatigueStart: 14, fatiguePer: 0.018, fatigueCap: 1.10,
};

function drag(poss, ath) {
  const raw = Math.max(0, poss - K.fatigueStart) * K.fatiguePer
            * Math.max(0.15, 1 - (ath - 45) / 60);
  return Math.min(K.fatigueCap, raw);
}

function view(fighter, poss) {
  const r = fighter.ratings;
  const d = drag(poss, r.ath);
  return {
    sc: norm(r.sc) - d,
    hnd: norm(r.hnd) - d,
    frm: norm(r.frm),              // size does not get tired
    def: norm(r.def) - d,
    ath: norm(r.ath) - d * 1.5,    // burst degrades fastest
  };
}

function pick3(rand, w) {
  const total = w[0] + w[1] + w[2];
  let x = rand() * total;
  if ((x -= w[0]) < 0) return 0;
  if ((x -= w[1]) < 0) return 1;
  return 2;
}

function simulateGame(fighterA, fighterB, seedStr) {
  const rand = rng(hashSeed(seedStr));
  const F = [fighterA, fighterB];
  const score = [0, 0];
  const log = [];
  let off = rand() < 0.5 ? 0 : 1;
  let poss = 0;
  const opening = `${F[off].manager} wins the check and takes it out first.`;

  // `extra` carries what a scouting report needs to read back off the log:
  // who got the rebound, and whether the look was clean.
  const push = (action, text, pts, extra) => {
    log.push({
      n: poss, off, offName: F[off].manager, action, text,
      pts: pts || 0, score: [score[0], score[1]], ...(extra || null),
    });
  };

  while (true) {
    poss++;
    if (poss > 400) break; // structural guard; never reached in practice
    const def = 1 - off;
    const O = F[off], D = F[def];
    const o = view(O, poss), d = view(D, poss);
    const S = O.slots, T = D.slots;

    // 1. Ball pressure.
    const pressure = 0.65 * d.def + 0.35 * d.ath;
    const security = 0.70 * o.hnd + 0.30 * o.ath;
    if (rand() < logistic(K.toBase + K.toK * (pressure - security))) {
      push('turnover', `${S.hnd.last}-handle gets picked clean by the ${T.def.last}-hands. Turnover.`, 0);
      off = def;
      continue;
    }

    // 2. Shot selection.
    const driveSep = (0.55 * o.ath + 0.45 * o.hnd) - (0.60 * d.def + 0.40 * d.ath);
    const driveU = driveSep + K.driveBias;
    const jumpU  = o.sc - (0.50 * d.def + 0.30 * d.frm) + K.jumpBias;
    const postU  = (0.60 * o.frm + 0.40 * o.sc) - (0.70 * d.frm + 0.30 * d.def) + K.postBias;
    const w = [driveU, jumpU, postU].map(u => Math.exp(K.choiceTemp * u));
    const choice = pick3(rand, w);

    let made = false, pts = 0, action, text, flag = null;

    if (choice === 0) {
      // DRIVE — worth 1. A big enough quickness edge produces a clean blow-by:
      // no help exists in 1v1, so beating your man IS the whole play. This is
      // what gives speed builds a lane against size.
      const separation = rand() < logistic(K.sepBase + K.sepK * driveSep);
      if (separation) flag = 'blowby';
      if (!separation) {
        const evade = 0.50 * o.ath + 0.30 * o.frm + 0.20 * o.hnd;
        const wall = 0.55 * d.frm + 0.45 * d.def;
        if (rand() < logistic(K.blockBase + K.blockK * wall - K.blockEvade * evade)) {
          push('block', `${S.ath.last}-first-step gets downhill — ${T.frm.last}-length meets him at the rim. BLOCKED.`, 0);
          off = def;
          continue;
        }
      }
      const att = 0.46 * o.ath + 0.30 * o.sc + 0.12 * o.frm + 0.12 * o.hnd;
      const dfn = 0.62 * d.def + 0.38 * d.frm;
      made = rand() < logistic(K.driveBase + K.driveK * (att - dfn) + (separation ? K.sepBonus : 0));
      pts = made ? 1 : 0;
      action = 'drive';
      text = separation
        ? (made
          ? `${S.hnd.last}-handle shakes ${T.def.last} clean off the dribble — uncontested at the rim. Good.`
          : `${S.hnd.last}-handle gets all the way by, but rushes it. In and out.`)
        : (made
          ? `${S.ath.last}-burst gets downhill and finishes over ${T.frm.last}-length. Good.`
          : `${S.ath.last}-burst attacks the rim, ${T.def.last}-contest is right there. Off the iron.`);
    } else if (choice === 1) {
      // JUMPER — worth 2. Whether it is contested at all is a race between the
      // shooter's release and the defender's closeout, which is why the check
      // below reads athleticism rather than length: a slow-footed giant cannot
      // contest a quick trigger no matter how long his arms are.
      const jumpSep = o.sc - (0.55 * d.def + 0.45 * d.ath);
      const clean = rand() < logistic(K.cleanBase + K.cleanK * jumpSep);
      if (clean) flag = 'clean';
      const att = 0.82 * o.sc + 0.18 * o.hnd;
      const dfn = clean ? (0.30 * d.def + 0.12 * d.frm) : (0.74 * d.def + 0.26 * d.frm);
      made = rand() < logistic(K.jumpBase + K.jumpK * (att - dfn));
      pts = made ? 2 : 0;
      action = 'jumper';
      text = clean
        ? (made
          ? `${S.sc.last}-release is up before ${T.ath.last} can close out. Nothing but net. Two.`
          : `${S.sc.last}-jumper, wide open, ${T.ath.last} nowhere near the closeout. Rattles out.`)
        : (made
          ? `${S.hnd.last}-handle creates the sliver of space, ${S.sc.last}-jumper rises over ${T.frm.last}-length. Wet. Two.`
          : `${S.sc.last}-jumper goes up contested by the ${T.def.last}-hand. Front rim.`);
    } else {
      // POST — worth 1.
      const att = 0.55 * o.frm + 0.45 * o.sc;
      const dfn = 0.62 * d.frm + 0.38 * d.def;
      made = rand() < logistic(K.postBase + K.postK * (att - dfn));
      pts = made ? 1 : 0;
      action = 'post';
      text = made
        ? `${S.frm.last}-frame backs ${T.frm.last} down to the block and finishes through the bump. Good.`
        : `${S.frm.last}-frame works the block, ${T.frm.last}-strength holds ground. Fadeaway is short.`;
    }

    if (made) {
      score[off] = Math.min(HARD_CAP, score[off] + pts);
      push(action, text, pts, { flag });
      const lead = score[off] - score[def];
      if ((score[off] >= TARGET && lead >= 2) || score[off] >= HARD_CAP) break;
      continue; // make it, take it
    }

    // 3. Miss — live ball.
    const oreb = (0.55 * o.frm + 0.45 * o.ath) - (0.55 * d.frm + 0.45 * d.ath);
    if (rand() < logistic(K.orebBase + K.orebK * oreb)) {
      push(action, `${text} ${S.frm.last}-frame rips his own miss back down. Reset.`, 0, { flag, reb: 'off' });
    } else {
      push(action, `${text} ${T.frm.last}-frame boxes out and secures it.`, 0, { flag, reb: 'def' });
      off = def;
    }
  }

  const winner = score[0] > score[1] ? 0 : 1;
  return {
    seed: seedStr,
    fighters: [fighterA.id, fighterB.id],
    managers: [fighterA.manager, fighterB.manager],
    score: [score[0], score[1]],
    winner,
    winnerId: F[winner].id,
    loserId: F[1 - winner].id,
    possessions: poss,
    opening,
    log,
  };
}

// Best-of-three. The series seed derives every game seed, so a whole series is
// reproducible from one string.
function simulateSeries(fighterA, fighterB, seedStr) {
  const games = [];
  const wins = [0, 0];
  for (let g = 1; g <= 3; g++) {
    const game = simulateGame(fighterA, fighterB, `${seedStr}|g${g}`);
    games.push(game);
    wins[game.winner]++;
    if (wins[game.winner] === 2) break;
  }
  const winner = wins[0] > wins[1] ? 0 : 1;
  return {
    seed: seedStr,
    managers: [fighterA.manager, fighterB.manager],
    ids: [fighterA.id, fighterB.id],
    games,
    wins,
    winner,
    winnerId: [fighterA, fighterB][winner].id,
    loserId: [fighterA, fighterB][1 - winner].id,
    pointDiff: games.reduce((s, g) => s + (g.score[0] - g.score[1]), 0),
  };
}


// Three groups of four, round robin, then a full placement bracket.
//
// The design constraint that shapes all of this: we need positions 1 through 12,
// not a champion. So every placement is decided by a series someone actually
// played. Nobody's night ends after one loss, and no draft slot is settled by a
// tiebreak formula.

const GROUP_NAMES = ['A', 'B', 'C'];
const EXPECTED_SERIES = 38; // 18 group + 20 bracket

function shuffled(list, rand) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Point differential is always counted from the perspective of `id`.
function diffFor(series, id) {
  const idx = series.ids.indexOf(id);
  return series.games.reduce((s, g) => s + (g.score[idx] - g.score[1 - idx]), 0);
}

function standings(memberIds, seriesList) {
  const rows = memberIds.map(id => ({ id, w: 0, l: 0, diff: 0, beat: new Set() }));
  const by = new Map(rows.map(r => [r.id, r]));
  for (const s of seriesList) {
    const win = by.get(s.winnerId), lose = by.get(s.loserId);
    win.w++; lose.l++;
    win.beat.add(s.loserId);
    win.diff += diffFor(s, s.winnerId);
    lose.diff += diffFor(s, s.loserId);
  }
  rows.sort((a, b) => {
    if (b.w !== a.w) return b.w - a.w;
    if (a.beat.has(b.id) !== b.beat.has(a.id)) return a.beat.has(b.id) ? -1 : 1; // head-to-head
    if (b.diff !== a.diff) return b.diff - a.diff;
    return a.id < b.id ? -1 : 1; // deterministic final fallback
  });
  return rows.map(({ beat, ...r }) => r);
}

function runTournament(fighters, seedStr = 'draft-2026', opts = {}) {
  if (!Array.isArray(fighters) || fighters.length !== 12) {
    const n = Array.isArray(fighters) ? fighters.length : 0;
    throw new Error(`the tournament needs exactly 12 locked builds — ${n} present, ${12 - n} still missing`);
  }
  const rand = rng(hashSeed(seedStr));
  const byId = new Map(fighters.map(f => [f.id, f]));
  const F = id => byId.get(id);
  const all = [];
  let n = 0;
  const play = (aId, bId, label, round) => {
    const s = simulateSeries(F(aId), F(bId), `${seedStr}|${label}|${n++}`);
    s.key = label; s.round = round;
    all.push(s);
    return s;
  };

  // --- Group stage -------------------------------------------------------
  const order = shuffled(fighters.map(f => f.id), rand);
  const groups = GROUP_NAMES.map((name, gi) => {
    const members = [order[gi], order[gi + 3], order[gi + 6], order[gi + 9]];
    const series = [];
    for (let i = 0; i < 4; i++)
      for (let j = i + 1; j < 4; j++)
        series.push(play(members[i], members[j], `group${name}-${i}${j}`, `Group ${name}`));
    return { name, members, series, table: standings(members, series) };
  });

  // --- Global seeding ----------------------------------------------------
  // Group winners take seeds 1-3, runners-up 4-6, and so on, each tier sorted
  // by record then point differential.
  const seeding = [];
  for (let pos = 0; pos < 4; pos++) {
    const tier = groups.map(g => ({ ...g.table[pos], group: g.name }));
    tier.sort((a, b) => (b.w - a.w) || (b.diff - a.diff) || (a.id < b.id ? -1 : 1));
    seeding.push(...tier.map(t => t.id));
  }
  const seedOf = id => seeding.indexOf(id) + 1;
  const S = k => seeding[k - 1]; // 1-indexed seed lookup

  // --- Bracket -----------------------------------------------------------
  const rounds = [];
  const addRound = (id, name, series) => { rounds.push({ id, name, series }); return series; };

  const r1 = addRound('r1', 'Play-In', [
    play(S(5), S(12), 'r1-a', 'Play-In'),
    play(S(6), S(11), 'r1-b', 'Play-In'),
    play(S(7), S(10), 'r1-c', 'Play-In'),
    play(S(8), S(9),  'r1-d', 'Play-In'),
  ]);

  const qf = addRound('qf', 'Quarterfinals', [
    play(S(1), r1[3].winnerId, 'qf-a', 'Quarterfinals'),
    play(S(2), r1[2].winnerId, 'qf-b', 'Quarterfinals'),
    play(S(3), r1[1].winnerId, 'qf-c', 'Quarterfinals'),
    play(S(4), r1[0].winnerId, 'qf-d', 'Quarterfinals'),
  ]);

  const sf = addRound('sf', 'Semifinals', [
    play(qf[0].winnerId, qf[3].winnerId, 'sf-a', 'Semifinals'),
    play(qf[1].winnerId, qf[2].winnerId, 'sf-b', 'Semifinals'),
  ]);

  const final = addRound('final', 'Final', [play(sf[0].winnerId, sf[1].winnerId, 'final', 'Final')])[0];
  const third = addRound('third', 'Third-Place Game',
    [play(sf[0].loserId, sf[1].loserId, 'third', 'Third-Place Game')])[0];

  // Consolation brackets: quarterfinal losers settle 5-8, play-in losers 9-12.
  const consol = (losers, tag, name, hiName, loName) => {
    const semis = addRound(tag + '-sf', name, [
      play(losers[0], losers[3], tag + '-sf-a', name),
      play(losers[1], losers[2], tag + '-sf-b', name),
    ]);
    const hi = addRound(tag + '-hi', hiName,
      [play(semis[0].winnerId, semis[1].winnerId, tag + '-hi', hiName)])[0];
    const lo = addRound(tag + '-lo', loName,
      [play(semis[0].loserId, semis[1].loserId, tag + '-lo', loName)])[0];
    return [hi.winnerId, hi.loserId, lo.winnerId, lo.loserId];
  };

  const p5to8   = consol(qf.map(s => s.loserId), 'c58', 'Fifth-Place Bracket',
                         'Fifth-Place Game', 'Seventh-Place Game');
  const p9to12  = consol(r1.map(s => s.loserId), 'c912', 'Ninth-Place Bracket',
                         'Ninth-Place Game', 'Eleventh-Place Game');

  const orderIds = [
    final.winnerId, final.loserId, third.winnerId, third.loserId,
    ...p5to8, ...p9to12,
  ];

  const decidedBy = {
    1: 'Won the Final', 2: 'Lost the Final',
    3: 'Won the third-place game', 4: 'Lost the third-place game',
    5: 'Won the fifth-place game', 6: 'Lost the fifth-place game',
    7: 'Won the seventh-place game', 8: 'Lost the seventh-place game',
    9: 'Won the ninth-place game', 10: 'Lost the ninth-place game',
    11: 'Won the eleventh-place game', 12: 'Lost the eleventh-place game',
  };

  const placements = orderIds.map((id, i) => {
    const played = all.filter(s => s.ids.includes(id));
    const w = played.filter(s => s.winnerId === id).length;
    return {
      place: i + 1, pick: i + 1, id, manager: F(id).manager,
      seed: seedOf(id),
      group: groups.find(g => g.members.includes(id)).name,
      record: `${w}-${played.length - w}`,
      seriesPlayed: played.length,
      decidedBy: decidedBy[i + 1],
    };
  });

  return { seed: seedStr, groups, seeding, rounds, placements, series: all,
           seriesCount: all.length };
}

// Play-by-play is regenerated from seeds on demand, so the stored tournament
// stays small enough for one db document.
function stripLogs(t) {
  const lean = s => ({
    key: s.key, round: s.round, ids: s.ids, managers: s.managers,
    wins: s.wins, winnerId: s.winnerId, loserId: s.loserId, seed: s.seed,
    scores: s.games.map(g => g.score),
  });
  return {
    seed: t.seed, seeding: t.seeding, placements: t.placements,
    seriesCount: t.seriesCount,
    groups: t.groups.map(g => ({ name: g.name, members: g.members, table: g.table,
                                 series: g.series.map(lean) })),
    rounds: t.rounds.map(r => ({ id: r.id, name: r.name, series: r.series.map(lean) })),
  };
}


// Scouting: run a build against opponents many times and report what happened.
//
// A single game tells you almost nothing — the engine is stochastic by design.
// Several hundred games tell you whether a build is actually good, and reading
// the play-by-play back tells you WHY, which is the part you can act on.


const DEFAULT_RUNS = 400;

// One head-to-head, aggregated.
function headToHead(a, b, runs = DEFAULT_RUNS, seedStr = 'scout') {
  const stat = () => ({ pts: 0, jumper: 0, drive: 0, post: 0, made: 0, shots: 0,
                        turnovers: 0, blocked: 0, oreb: 0, clean: 0, blowby: 0 });
  const s = [stat(), stat()];
  let wins = 0, poss = 0, seriesWins = 0;
  const scores = [0, 0];

  for (let i = 0; i < runs; i++) {
    const g = simulateGame(a, b, `${seedStr}#${i}`);
    if (g.winner === 0) wins++;
    scores[0] += g.score[0]; scores[1] += g.score[1];
    poss += g.possessions;
    for (const l of g.log) {
      const t = s[l.off];
      t.pts += l.pts;
      if (l.action === 'turnover') { t.turnovers++; continue; }
      if (l.action === 'block') { t.blocked++; continue; }
      t.shots++; t[l.action]++;
      if (l.pts) t.made++;
      if (l.reb === 'off') t.oreb++;
      if (l.flag === 'clean') t.clean++;
      if (l.flag === 'blowby') t.blowby++;
    }
  }
  for (let i = 0; i < Math.ceil(runs / 4); i++) {
    if (simulateSeries(a, b, `${seedStr}-bo3#${i}`).winner === 0) seriesWins++;
  }

  const per = t => ({
    ppg: t.pts / runs,
    fg: t.shots ? t.made / t.shots : 0,
    mix: { jumper: t.shots ? t.jumper / t.shots : 0, drive: t.shots ? t.drive / t.shots : 0,
           post: t.shots ? t.post / t.shots : 0 },
    turnovers: t.turnovers / runs, blocked: t.blocked / runs, oreb: t.oreb / runs,
    cleanRate: t.jumper ? t.clean / t.jumper : 0,
    blowbyRate: t.drive ? t.blowby / t.drive : 0,
  });

  return {
    runs, winRate: wins / runs, seriesRate: seriesWins / Math.ceil(runs / 4),
    avgScore: [scores[0] / runs, scores[1] / runs],
    possessions: poss / runs,
    you: per(s[0]), them: per(s[1]),
  };
}

// The headline number: how the build holds up across a spread of archetypes.
function gauntlet(fighter, opponents, runs = 200, seedStr = 'gauntlet') {
  const rows = opponents.map(o => {
    const h = headToHead(fighter, o, runs, `${seedStr}|${o.id}`);
    return { id: o.id, name: o.manager, winRate: h.winRate,
             avgScore: h.avgScore, possessions: h.possessions };
  });
  const overall = rows.reduce((s, r) => s + r.winRate, 0) / rows.length;
  const sorted = [...rows].sort((x, y) => y.winRate - x.winRate);
  return { rows, overall, best: sorted[0], worst: sorted[sorted.length - 1] };
}

// Which of the five picks is actually carrying the build? Replace one slot with
// a replacement-level player and see how far the win rate falls. A slot worth
// almost nothing is a slot you are overpaying for.
const REPLACEMENT = 68;

function leverage(build, pool, opponents, toFighter, runs = 120, seedStr = 'lev') {
  const byId = pool instanceof Map ? pool : new Map(pool.map(p => [p.id, p]));
  const base = gauntlet(toFighter(build, pool), opponents, runs, seedStr + '|base').overall;
  const used = new Set(Object.values(build.picks));

  return SLOTS.map(slot => {
    // Cheapest player near replacement level who is not already in the build.
    const filler = [...byId.values()]
      .filter(p => !used.has(p.id) || p.id === build.picks[slot.key])
      .reduce((best, p) => Math.abs(p[slot.key] - REPLACEMENT) <
                           Math.abs(best[slot.key] - REPLACEMENT) ? p : best);
    const swapped = { ...build, picks: { ...build.picks, [slot.key]: filler.id } };
    const after = gauntlet(toFighter(swapped, pool), opponents, runs, seedStr + '|' + slot.key).overall;
    const current = byId.get(build.picks[slot.key]);
    return {
      slot: slot.key, label: slot.label,
      player: current.name, rating: current[slot.key], cost: costOf(current[slot.key]),
      swapTo: filler.name, swapRating: filler[slot.key],
      drop: base - after,
      perPoint: (base - after) / Math.max(1, costOf(current[slot.key]) - costOf(filler[slot.key])),
    };
  }).sort((a, b) => b.drop - a.drop);
}

function grade(overall) {
  const o = overall * 100;
  return o >= 65 ? 'Strong' : o >= 52 ? 'Solid' : o >= 45 ? 'Middling' : 'Struggling';
}

// Plain-language read on a set of gauntlet results.
function readout(g, h) {
  const pct = x => Math.round(x * 100);
  const lines = [];
  const o = pct(g.overall);
  lines.push(`${grade(g.overall)} — wins ${o}% across the field.`);
  lines.push(`Best matchup: ${g.best.name} (${pct(g.best.winRate)}%). Worst: ${g.worst.name} (${pct(g.worst.winRate)}%).`);
  if (h) {
    const m = h.you.mix;
    const top = m.jumper >= m.drive && m.jumper >= m.post ? 'jumpers'
              : m.drive >= m.post ? 'drives' : 'post-ups';
    lines.push(`Your offense runs through ${top} (${pct(Math.max(m.jumper, m.drive, m.post))}% of shots), shooting ${pct(h.you.fg)}%.`);
    if (h.you.turnovers > h.them.turnovers * 1.4) {
      lines.push(`Ball security is a problem — you cough it up ${h.you.turnovers.toFixed(1)} times a game to their ${h.them.turnovers.toFixed(1)}.`);
    }
    if (h.them.cleanRate > 0.45) {
      lines.push(`You are giving up clean looks on ${pct(h.them.cleanRate)}% of their jumpers — that is a closeout problem.`);
    }
    if (h.you.oreb > h.them.oreb * 1.4) {
      lines.push(`Your frame is winning the glass: ${h.you.oreb.toFixed(1)} second chances a game.`);
    }
  }
  return lines;
}

/* ── the field ───────────────────────────────────────────────────────────

const PRESETS = [{"name": "The Sniper","tag": "Elite shot-making with size and hops. Cannot dribble, will not guard you.","picks": {"sc": "curry16","hnd": "klay16","frm": "kp18","def": "book22","ath": "zion21"}},{"name": "The Wall","tag": "All frame and rim protection. Cannot create a shot to save his life.","picks": {"sc": "stockton90","hnd": "duncan03","frm": "shaq00","def": "hakeem94","ath": "isiah89"}},{"name": "The Blur","tag": "First step and handle, no size at all.","picks": {"sc": "drob95","hnd": "kyrie17","frm": "maxey24","def": "boogie16","ath": "giannis21"}},{"name": "The Lockdown","tag": "Built to stop you. Scores just enough to punish you for it.","picks": {"sc": "brand06","hnd": "hakeem94","frm": "jordan90","def": "wemby25","ath": "pippen94"}},{"name": "The Bully","tag": "Backs you down until something gives.","picks": {"sc": "luka24","hnd": "reggie95","frm": "shaq00","def": "drexler92","ath": "kareem77"}},{"name": "The Prototype","tag": "No weakness, no elite slot. The build everyone talks themselves into.","picks": {"sc": "wemby25","hnd": "lebron13","frm": "jordan90","def": "joshsmith10","ath": "ad20"}},{"name": "The Iso Handler","tag": "Breaks you down off the dribble every single possession.","picks": {"sc": "kobe06","hnd": "kyrie17","frm": "ray01","def": "blake14","ath": "shaq00"}},{"name": "The Freak","tag": "Athletic monster with real length. Raw tools over polish.","picks": {"sc": "brand06","hnd": "kg04","frm": "magic87","def": "kobe06","ath": "lebron13"}}];

/* ── build codes ────────────────────────────────────────────────────────
   A shared link only reaches people inside your Claude organization. A league
   is twelve friends, so a build has to survive a text message too: this is the
   whole build as one short string the commissioner can paste back in. */
function encodeBuild(i, picks){
  return 'BD' + (i + 1) + '-' + SLOT_KEYS.map(k => picks[k] || '_').join('.');
}
function decodeBuild(code){
  const m = /BD(\d{1,2})-([A-Za-z0-9_]+(?:\.[A-Za-z0-9_]+){4})/.exec(String(code).trim());
  if (!m) return { error: 'not a build code' };
  const i = Number(m[1]) - 1;
  if (i < 0 || i >= managers().length) return { error: 'manager ' + m[1] + ' is not in this league' };
  const ids = m[2].split('.');
  const picks = {};
  for (let k = 0; k < SLOT_KEYS.length; k++) {
    if (!BY_ID.has(ids[k])) return { error: 'unknown player "' + ids[k] + '"' };
    picks[SLOT_KEYS[k]] = ids[k];
  }
  const v = validateBuild(picks, POOL, budget());
  if (!v.ok) return { error: managers()[i] + ': ' + v.errors.join('; ') };
  return { index: i, picks };
}

/* ── derived ────────────────────────────────────────────────────────────── */
const managers = () => S.league ? S.league.managers : [];

}

/* ── header ─────────────────────────────────────────────────────────────── */
function paintBoard(){

  // Lock count and "you" are league facts; in the sandbox they are just noise.

  $('st-me').parentElement.style.display = leagueOnly;

  const t = [{ id:'lab', label:'Lab' }];
  if (S.league) t.push({ id:'build', label:'Build' }, { id:'league', label:'League' },
                       { id:'tournament', label:'Tournament' });
  if (S.tourney) t.push({ id:'board', label:'Draft Board' });
  t.push({ id:'setup', label:S.league ? 'Setup' : 'Start a League' });
  return t;
};
function paintTabs(){
  $('tabs').innerHTML = TABS().map(t => {
    const n = lockedList().length, total = managers().length || 12;
    const badge = (t.id === 'league' && S.league && n < total)
      ? '<span class="badge">' + (total - n) + '</span>' : '';
    return '<button class="tab" role="tab" data-tab="' + t.id + '" aria-selected="' +
      (S.tab === t.id) + '">' + t.label + badge + '</button>';
  }).join('');
}

function screenIdentify(){

    <div class="head"><h2>Who Are You?</h2></div><div class="courtline"></div>
    <p class="lede" style="margin:12px 0 18px">Pick your name to claim a slot. Your build stays on

function capSheet(picks, opts){
  const v = priced(picks);
  const spent = v.total, rem = budget() - spent, over = spent > budget();
  const pct = Math.min(100, Math.round(spent / budget() * 100));
  return `<aside class="sheet">
    <div class="sheet-hd"><h3>${esc(opts.title)}</h3></div>
    <div class="cap">
      <div class="cap-row"><b class="num" style="color:${over ? 'var(--accent)' : 'inherit'}">${spent}</b>
        <small>${over ? (spent - budget()) + ' over' : rem + ' left'} · cap ${budget()}</small></div>
      <div class="meter"><i class="${over ? 'over' : ''}" style="width:${pct}%"></i></div>
    </div>
    ${SLOTS.map(sl => {
      const line = v.lines.find(l => l.slot === sl.key);
      const p = line.empty ? null : line.player;
      return `<button class="slot" data-slot="${sl.key}" aria-current="${S.slot === sl.key}">
        <span class="slot-k">${sl.label}</span>
        <span class="slot-v${p ? '' : ' empty'}">${p ? esc(p.name) : 'Not picked'}</span>
        <span class="slot-sub">${p ? esc(p.season) + ' · ' + esc(p.team) : esc(sl.blurb)}</span>
        <span class="slot-r">${p ? `<span class="rating">${line.rating}</span>
          <span class="price num">${line.cost}</span>` : ''}</span></button>`;
    }).join('')}
    <div class="sheet-ft">
      ${v.errors.map(e => `<p class="warn">${esc(e[0].toUpperCase() + e.slice(1))}</p>`).join('')}
      ${opts.footer}
    </div></aside>`;
}

function poolTable(picks, opts){
  const v = priced(picks);
  const slot = SLOTS.find(sl => sl.key === S.slot);
  const q = S.q.toLowerCase();
  const locked = opts.locked;
  let rows = POOL.filter(p => (S.era === 'all' || p.era === S.era) &&
    (!q || p.name.toLowerCase().includes(q) || p.team.toLowerCase().includes(q)));
  rows.sort((a, z) => S.sortBy === 'cost' ? costOf(a[S.slot]) - costOf(z[S.slot])
                    : S.sortBy === 'name' ? (a.name < z.name ? -1 : 1)
                    : z[S.slot] - a[S.slot]);
  const otherSpend = v.lines.filter(l => l.slot !== S.slot && !l.empty)
                            .reduce((s2, l) => s2 + l.cost, 0);
  const canSpend = budget() - otherSpend;
  return `<div class="pool">
    <div class="pool-hd"><h3>${esc(slot.label)}</h3>
      <input type="search" id="in-q" placeholder="Search 144 players" value="${esc(S.q)}" ${locked ? 'disabled' : ''}>
      <select id="in-era" ${locked ? 'disabled' : ''}>
        <option value="all"${S.era==='all'?' selected':''}>All eras</option>
        <option value="current"${S.era==='current'?' selected':''}>2015-2025</option>
        <option value="2000s"${S.era==='2000s'?' selected':''}>2005-2014</option>
        <option value="legend"${S.era==='legend'?' selected':''}>Pre-2005</option></select>
      <select id="in-sort" ${locked ? 'disabled' : ''}>
        <option value="rating"${S.sortBy==='rating'?' selected':''}>Best first</option>
        <option value="cost"${S.sortBy==='cost'?' selected':''}>Cheapest first</option>
        <option value="name"${S.sortBy==='name'?' selected':''}>A-Z</option></select></div>
    <p class="note" style="padding:9px 15px;margin:0;border-bottom:1px solid var(--line-soft)">${esc(slot.blurb)}
      ${locked ? '' : ` You have <b class="num">${canSpend}</b> to spend here.`}</p>
    <div class="scroll"><table><thead><tr>
      <th>Player</th><th>Era</th><th class="r">${esc(slot.short)}</th><th class="r">Cost</th><th></th>
    </tr></thead><tbody>${rows.map(p => {
      const c = costOf(p[S.slot]);
      const isPicked = picks[S.slot] === p.id;
      const usedElsewhere = !isPicked && SLOT_KEYS.some(k => k !== S.slot && picks[k] === p.id);
      const afford = c <= canSpend;
      const blocked = usedElsewhere || (!afford && !isPicked);
      return `<tr class="${isPicked ? 'picked' : ''}${blocked ? ' unaffordable' : ''}">
        <td><div class="p-name">${esc(p.name)}</div>
            <div class="p-meta">${esc(p.season)} · ${esc(p.team)}</div>
            <div class="p-note">${esc(p.note)}</div></td>
        <td><span class="era">${ERA[p.era]}</span></td>
        <td class="r"><span class="big">${p[S.slot]}</span></td>
        <td class="r"><span class="num">${c}</span></td>
        <td class="r">${locked ? '' : isPicked
          ? '<span class="pill live"><span>Yours</span></span>'
          : usedElsewhere
          ? '<span class="pill">Used</span>'
          : `<button class="btn sm ${afford ? 'hot' : 'ghost'}" data-pick="${p.id}">${afford ? 'Take' : 'Over cap'}</button>`}</td></tr>`;
    }).join('')}</tbody></table></div></div>`;
}

function screenBuild(){
  const b = myBuild();
  const picks = b ? b.picks : {};
  const v = priced(picks);
  const locked = b && b.locked;
  const footer = locked
    ? `<span class="pill live" style="justify-content:center;padding:9px"><span class="dot"></span><span>Locked in</span></span>
       <p class="note" style="margin:0">Send this to your commissioner:</p>
       <code class="num" style="display:block;background:var(--sunken);border:1px solid var(--line);
         padding:7px 9px;font-size:12px;word-break:break-all">${esc(encodeBuild(S.me, picks))}</code>
       <button class="btn ghost sm" data-act="copy-code">Copy build code</button>
       <button class="btn ghost" data-act="unlock">Unlock and edit</button>`
    : `<button class="btn hot" data-act="lock" ${v.ok ? '' : 'disabled'}>Lock in build</button>
       <button class="btn ghost sm" data-act="to-lab">Test this in the Lab</button>
       <p class="note">${v.ok ? 'Once you lock, your build is final until you unlock it.' : 'Fill all five slots inside the cap to lock in.'}</p>`;
  return `<section><p class="eyebrow">${esc(S.league.name)} · Your build</p>
    <div class="head"><h2>Build Your Guy</h2>
      <p class="note" style="max-width:46ch">Take one attribute from each of five players.

    <div class="courtline" style="margin-bottom:16px"></div>

function labFighters(){
  return PRESETS.map((p, i) =>
    toFighter({ id: 'preset' + i, manager: p.name, picks: p.picks }, POOL));
}

function pctBar(rate){
  const w = Math.abs(rate - 0.5) * 200;
  return `<div class="track"><div class="mid"></div>
    <div class="fill ${rate >= 0.5 ? 'win' : 'loss'}"
      style="${rate >= 0.5 ? 'left:50%' : 'right:50%'};width:calc(${w.toFixed(1)}% - 1px)"></div></div>`;
}
const pc = x => Math.round(x * 100);

function reportView(r){
  const g = r.gauntlet, h = r.h2h, lev = r.leverage;
  const worst = Math.max(...lev.map(l => Math.abs(l.drop)), 0.05);
  const mix = h.you.mix;
  return `<div class="report">
    <div class="report-hd"><h3>Scouting Report</h3>
      <span class="pill">${r.runs} games per matchup</span>
      <button class="btn ghost sm" data-act="rescout">Run it again</button></div>

    <div class="hero"><b class="num" style="color:${g.overall >= 0.5 ? 'var(--viz-win)' : 'var(--viz-loss)'}">${pc(g.overall)}%</b>
      <span class="cap"><i>${esc(grade(g.overall))} · wins against the field</i>
        <span style="font-size:13px;color:var(--ink-2)">Averaged across all eight
        archetypes, each of them built to the same ${budget()}-point cap.</span></span></div>
    <ul class="reads">${r.readout.slice(1).map(l => `<li>${esc(l)}</li>`).join('')}</ul>

    <div class="vsec"><h4>Matchup by matchup</h4>
      <p class="note">Win rate against each archetype. The centre line is an even fight.</p>
      <div class="legend">
        <span><i style="background:var(--viz-win)"></i>You win more</span>
        <span><i style="background:var(--viz-loss)"></i>You lose more</span></div>
      <div class="bars">${g.rows.map(row => `<div class="bar">
        <span class="lbl">${esc(row.name)}</span>
        ${pctBar(row.winRate)}
        <span class="val" style="color:${row.winRate >= 0.5 ? 'var(--viz-win)' : 'var(--viz-loss)'}">${pc(row.winRate)}%</span>
      </div>`).join('')}</div>
      <div class="axis"><span><span>0%</span><span>even</span><span>100%</span></span></div>
      <details class="tbl"><summary>Show as a table</summary>
        <table><thead><tr><th>Opponent</th><th class="r">Win rate</th><th class="r">Avg score</th>
          <th class="r">Possessions</th></tr></thead><tbody>
          ${g.rows.map(row => `<tr><td>${esc(row.name)}</td>
            <td class="r num">${pc(row.winRate)}%</td>
            <td class="r num">${row.avgScore[0].toFixed(1)}-${row.avgScore[1].toFixed(1)}</td>
            <td class="r num">${row.possessions.toFixed(0)}</td></tr>`).join('')}
        </tbody></table></details></div>

    <div class="vsec"><h4>Which picks are carrying you</h4>
      <p class="note">What each pick is worth next to a replacement-level player in that slot.
        A pick below the line is worse than a cheap alternative — you are paying for nothing.</p>
      <div class="legend">
        <span><i style="background:var(--viz-win)"></i>Earning its cost</span>
        <span><i style="background:var(--viz-loss)"></i>Costing you wins</span></div>
      <div class="bars">${lev.map(l => {
        const w = Math.min(48, Math.abs(l.drop) / worst * 48);
        const up = l.drop >= 0;
        return `<div class="bar">
        <span class="lbl">${esc(l.label)}</span>
        <div class="track"><div class="mid"></div>
          <div class="fill ${up ? 'win' : 'loss'}"
            style="${up ? 'left:50%' : 'right:50%'};width:calc(${w.toFixed(1)}% - 1px)"></div></div>
        <span class="val" style="color:${up ? 'var(--viz-win)' : 'var(--viz-loss)'}">${pc(l.drop) === 0 ? 'even' : (up ? '+' : '\u2212') + Math.abs(pc(l.drop)) + ' pts'}</span>
      </div>`; }).join('')}</div>
      <div class="axis"><span><span>worse than replacement</span><span>even</span><span>carrying you</span></span></div>
      <details class="tbl"><summary>Show as a table</summary>
        <table><thead><tr><th>Slot</th><th>Your pick</th><th class="r">Rating</th>
          <th class="r">Cost</th><th class="r">Worth vs replacement</th></tr></thead><tbody>
          ${lev.map(l => `<tr><td>${esc(l.label)}</td><td>${esc(l.player)}</td>
            <td class="r num">${l.rating}</td><td class="r num">${l.cost}</td>
            <td class="r num">${pc(l.drop) === 0 ? 'even' : (l.drop >= 0 ? '+' : '\u2212') + Math.abs(pc(l.drop)) + ' pts'}</td></tr>`).join('')}
        </tbody></table></details></div>

    <div class="vsec"><h4>How you score</h4>
      <p class="note">Shot mix and accuracy against ${esc(r.h2hName)}, over ${r.runs} games.</p>
      ${[['Jumpers (2s)', mix.jumper], ['Drives (1s)', mix.drive], ['Post-ups (1s)', mix.post]]
        .map(([label, val]) => `<div class="mixrow"><span>${label}</span>
          <div class="track"><div class="fill mag" style="width:calc(${(val * 96).toFixed(1)}% - 4px)"></div></div>
          <span class="val">${pc(val)}% of shots</span></div>`).join('')}
      <div class="mixrow" style="border-top:1px solid var(--line-soft);margin-top:7px;padding-top:9px">
        <span>Overall</span><span class="val" style="grid-column:2/4">${pc(h.you.fg)}% shooting ·
        ${h.you.ppg.toFixed(1)} points · ${h.you.turnovers.toFixed(1)} turnovers ·
        ${h.you.oreb.toFixed(1)} offensive boards a game</span></div></div>

    <div class="vsec"><h4>Watch a game</h4>
      <p class="note">Every possession, against any of the eight. Same engine the tournament uses.</p>
      <div class="oppgrid">${PRESETS.map((p, i) => `<button class="opp" data-watch="${i}"
        aria-pressed="${r.h2hIndex === i}">
        <b>${esc(p.name)}</b><span>${esc(p.tag)}</span>
        <code>${SLOT_KEYS.map(k => POOL.find(x => x.id === p.picks[k])[k]).join(' / ')}</code>
      </button>`).join('')}</div></div>
  </div>`;
}

function screenLab(){
  const picks = S.lab.picks;
  const v = priced(picks);
  const footer = `<button class="btn hot" data-act="scout" ${v.ok && !S.lab.busy ? '' : 'disabled'}>
      ${S.lab.busy ? 'Scouting…' : 'Scout this build'}</button>
    ${S.league && S.me != null && myBuild() && !myBuild().locked
      ? '<button class="btn ghost sm" data-act="to-league">Use this for my league build</button>' : ''}
    <button class="btn ghost sm" data-act="lab-random">Surprise me</button>
    <button class="btn ghost sm" data-act="lab-clear">Clear</button>
    <p class="note">${v.ok ? 'Runs 400 games against each of eight archetypes.'
      : 'Fill all five slots inside the cap to scout it.'}</p>`;
  return `<section><p class="eyebrow">Sandbox · no league needed</p>
    <div class="head"><h2>The Lab</h2>
      <p class="note" style="max-width:48ch">Build anything and find out how it actually holds up.
        Nothing here touches your league.</p></div>
    <div class="courtline" style="margin-bottom:16px"></div>
    <div class="bay">${capSheet(picks, { title: 'Test Build', footer })}${poolTable(picks, { locked: false })}</div>

function buildDl(b){

  return `<dl>${v.lines.map(l => `<dt>${SLOTS.find(s => s.key === l.slot).short}</dt>
    <dd>${l.empty ? '—' : esc(l.player.name)}</dd>
    <dd class="v">${l.empty ? '' : l.rating + ' · ' + l.cost}</dd>`).join('')}</dl>
    <div class="p-meta">Spent ${v.total} of ${budget()}</div>`;
}

function screenLeague(){
  const total = managers().length, n = lockedList().length, reveal = n === total;
  return `<section><p class="eyebrow">${esc(S.league.name)}</p>
    <div class="head"><h2>The League</h2>
      <span class="pill ${reveal ? 'live' : 'hot'}"><span class="dot"></span><span>${n} of ${total} locked</span></span></div>
    <div class="courtline" style="margin-bottom:16px"></div>

    <div class="grid">${managers().map((m, i) => {
      const b = S.builds[String(i)];

      return `<article class="mgr ${b && b.locked ? 'locked' : ''} ${mine ? 'you' : ''}">
        <div class="mgr-hd"><b>${esc(m)}</b>
          <span class="pill ${b && b.locked ? 'live' : ''}">${b && b.locked ? 'Locked' : b ? 'Building' : 'Not started'}</span></div>
